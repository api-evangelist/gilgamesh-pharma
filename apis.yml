name: Gilgamesh Pharma
description: >-
  Gilgamesh Pharma (Gilgamesh Pharmaceuticals, Inc.) is a New York based clinical-stage
  neuroscience company founded in 2019 that develops rapid-acting, next-generation
  therapeutics for psychiatric and substance use disorders. Its discovery and translational
  platform combines medicinal chemistry, neurocircuitry science, electrophysiology and
  machine learning to identify new chemical entities, and its pipeline spans short-acting
  5-HT2A receptor agonists, NMDA receptor antagonists, non-hallucinogenic neuroplastogens,
  cardiac-safe ibogaine analogs and M1/M4 muscarinic programs. Lead assets include
  bretisilocin (GM-2505), acquired by AbbVie in August 2025, and blixeprodil (GM-1020), an
  orally bioavailable NMDAR antagonist in Phase 2 for major depressive disorder. Gilgamesh
  is a drug developer, not a software vendor: it publishes no developer program, public
  API, SDK or machine-readable specification of any kind.
